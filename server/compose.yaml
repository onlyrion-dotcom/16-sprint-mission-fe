services:
  db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda_local
      POSTGRES_DB: panda_market
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - panda_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  panda_market_data: